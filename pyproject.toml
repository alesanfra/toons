[build-system]
requires = ["maturin>=1.13.3,<2.0"]
build-backend = "maturin"

[project]
name = "toons"
authors = [
    { name = "Alessio Sanfratello", email = "sanfra90@gmail.com" },
]
description = "A high-performance TOON (Token Oriented Object Notation) parser and serializer for Python, implemented in Rust."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["toon", "serialization", "llm", "tokens", "json"]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/alesanfra/toons"
Source = "https://github.com/alesanfra/toons"
Documentation = "https://toons.readthedocs.io"
Changelog = "https://github.com/alesanfra/toons/blob/main/CHANGELOG.md"
Issues = "https://github.com/alesanfra/toons/issues"

[dependency-groups]
dev = [
    "maturin>=1.13.3",
    "pre-commit>=2.21.0",
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-autorefs>=0.4.1",
    "mkdocs-material>=9.2.7",
    "mkdocstrings>=0.22.0",
    "mkdocstrings-python>=1.1.2",
    "pymdown-extensions>=10.2.1",
]

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py38"]
include = ["toons.pyi"]

[tool.ruff]
line-length = 79

[tool.ruff.format]
# Documentation snippets are wrapped for reading, not to 79 columns. They are
# verified by running them, not by the formatter.
exclude = ["**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, isort
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Expected TOON output and sample documents are literal strings that cannot
# be wrapped without changing what they assert.
"tests/**" = ["E501"]
"benchmarks/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["toons"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
