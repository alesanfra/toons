version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
    rust: "1.86"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: false

python:
  install:
    # Regenerate with:
    #   uv export --only-group docs --no-hashes --no-emit-project -o docs/requirements.txt
    - requirements: docs/requirements.txt
    - method: pip
      path: .
