version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: latest
    rust: latest

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: false

python:
  install:
    # uv sync reads pyproject.toml and uv.lock, so the docs dependencies and
    # the extension itself come from the same pins as local development.
    - method: uv
      command: sync
      groups:
        - docs
